theses:
  - title: Transformation chaining based on domain-specific custom information loss
    text: >-
      Model transformations are crucial in MDE for refactoring, simulation and code generation,
      but they are hard to design, implement and verify. Chaining existing transformations
      improves reuse. When several chains bridge a source and a target metamodel, the best one
      can be selected by quality criteria such as coverage and information loss. The thesis
      extends existing algorithms to support a domain-specific notion of importance that can be
      refined at the instance level.
    references:
      - text: "Basciani, Di Pompeo, Di Ruscio, Iovino, Pierantonio. Integrating semantic reasoning in information loss-based transformation chain rankers. SAC 2021."
        url: https://doi.org/10.1145/3412841.3442024
      - text: "Basciani et al. Automated selection of optimal model transformation chains via shortest-path algorithms. IEEE TSE 46(3), 2018."
