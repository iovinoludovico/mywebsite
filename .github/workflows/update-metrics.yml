name: Update metrics

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Google Scholar metrics
        run: node scripts/update-metrics.mjs
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/metrics.json; then
            echo "No metric changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update citation metrics"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
