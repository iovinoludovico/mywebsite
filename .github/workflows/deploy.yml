name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by the iovinoludovico/publications repo when publications.bib changes.
  repository_dispatch:
    types: [publications-updated]
  # Nightly rebuild as a safety net for the publication list.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3.0.2
        with:
          node-version: 22
        env:
          # Commit of publications.bib that triggered the rebuild (empty = main).
          BIB_REF: ${{ github.event.client_payload.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
